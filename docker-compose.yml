version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres-matricula
    environment:
      POSTGRES_DB: matriculafacil
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - matricula-network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: catijr-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/matriculafacil
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - postgres
    networks:
      - matricula-network
    restart: unless-stopped

volumes:
  postgres_data:
    name: postgres_matricula_data

networks:
  matricula-network:
    driver: bridge